<div class="container">
  <img src="{{imageUrl()}}" alt="" class="vignette">
  <div (click)="handleOpenImageDetails($event)" class="interaction-overlay">
    <button class="button-remove" (click)="handleRemoveImage($event)">
      <svg
        class="cross"
        width="100%"
        height="100%"
        viewBox="0 0 100 100"
      >
        <path
          d="M10 10 L90 90 M10 90 L90 10"
          stroke-linecap="round"
          fill="transparent"
        />
      </svg>
    </button>
  </div>
</div>
