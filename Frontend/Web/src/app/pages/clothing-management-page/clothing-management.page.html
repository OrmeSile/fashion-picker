<fp-drop-zone class="drop-zone" (files)="handleDataTransfer($event)"/>
<div class="clothing-preview-grid">
@for (file of files(); track file.id) {
  <fp-clothing-preview-card
    class="preview-card"
    [file]="file"
    (clothingTypeSelected)="handleClothingTypeSelected({selected: $event, id: file.id})"
  />
}
</div>
