<fp-drop-zone class="drop-zone" (files)="handleDataTransfer($event)" [multiple]="true"/>
<div class="clothing-preview-grid">
@for (state of fileStates(); track state.file.id) {
  <fp-clothing-preview-card
    class="preview-card"
    [file]="state.file"
    [loading]="state.loading"
    [success]="state.success"
    (clothingTypeSelected)="handleClothingTypeSelected({selected: $event, id: state.file.id})"
  />
}
</div>
