
<input
  #focusTarget
  [disabled]="disabled()"
  class="tag-input"
  type="text"
  [value]="value()"
  (input)="handleInput($event)"
  [style.width]="`${sizingSpanWidth()}px`"
  (keydown.enter)="handleKeydownEnter($event)"
  (keydown.escape)="handleKeydownEscape($event)"
  (blur)="handleBlur()"
/>
<span #sizingSpan class="sizing-span">{{value()}}</span>
@if (!disabled()) {
  <div class="actions-container">
    <div
      tabindex="0"
      class="icon-container cancel-icon-container"
      (click)="delete()"
      (keydown)="delete()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-x"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M18 6l-12 12"/>
        <path d="M6 6l12 12"/>
      </svg>
    </div>
  </div>
}
