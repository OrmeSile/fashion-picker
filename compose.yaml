services:
  db:
    container_name: db
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  fashionpicker.api:
    container_name: api
    build:
      context: .
      dockerfile: FashionPicker.Api/Dockerfile
    env_file:
      - ./secrets/.env.fashion-picker

  fashionpicker.filerepository:
    container_name: file-repository
    build:
      context: .
      dockerfile: FashionPicker.FileRepository/Dockerfile
    env_file:
      - ./secrets/.env.file-repository

    volumes:
      - type: bind
        source: "${STATIC_HOST_PATH}"
        target: /var/lib/filerepository

  fashionpicker.api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: Fashionpicker.ApiGateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - "${REVERSE_PROXY_ENV}"

  reverse-proxy:
    build:
      context: Frontend/Web
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
volumes:
  pgdata: