services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  fashionpicker.api:
    build:
      context: .
      dockerfile: FashionPicker.Api/Dockerfile
    ports:
      - "5000:5000"

  fashionpicker.filerepository:
    build:
      context: .
      dockerfile: FashionPicker.FileRepository/Dockerfile
    volumes:
      - frdata:/var/lib/filerepository
volumes:
  pgdata:
  frdata: